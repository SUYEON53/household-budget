<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홈 — 가계부</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f8fc; --s1: #ffffff; --s2: #f2f4f9; --s3: #eaecf4;
  --border: #e2e6f0; --blue: #7b9fd4; --blue-light: #eef3fb;
  --green: #6bab8a; --green-light: #edf7f2; --red: #d47b7b;
  --gold: #c9a96e; --purple: #9b8fcc; --text: #3a3d52; --text2: #5a5e78;
  --muted: #9da3bc; --sans: 'Noto Sans KR', sans-serif;
  --shadow: 0 2px 8px rgba(0,0,0,.05), 0 6px 24px rgba(0,0,0,.04);
}
body { background: var(--bg); font-family: var(--sans); min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }

.home-wrap { width: 100%; max-width: 480px; }

.home-logo { text-align: center; margin-bottom: 40px; }
.home-logo-icon { font-size: 40px; margin-bottom: 8px; }
.home-logo-title { font-size: 22px; font-weight: 700; color: var(--text); }
.home-logo-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

.home-cards { display: flex; flex-direction: column; gap: 16px; }

.home-card {
  background: var(--s1); border-radius: 20px; padding: 28px 24px;
  box-shadow: var(--shadow); border: 1.5px solid var(--border);
  cursor: pointer; transition: all .2s; text-decoration: none;
  display: flex; align-items: center; gap: 20px;
}
.home-card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,.08); }
.home-card:active { transform: translateY(0); }

.home-card-icon { font-size: 40px; flex-shrink: 0; width: 64px; height: 64px;
  border-radius: 16px; display: flex; align-items: center; justify-content: center; }
.home-card-icon.budget { background: var(--blue-light); }
.home-card-icon.stock { background: var(--green-light); }

.home-card-info { flex: 1; }
.home-card-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.home-card-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
.home-card-arrow { font-size: 20px; color: var(--muted); flex-shrink: 0; }
</style>
</head>
<body>
<div class="home-wrap">
  <div class="home-logo">
    <div class="home-logo-icon">🏡</div>
    <div class="home-logo-title">우리집 매니저</div>
    <div class="home-logo-sub">자산관리 · 재고관리를 한곳에서</div>
  </div>

  <div class="home-cards">
    <a href="/budget.html" class="home-card">
      <div class="home-card-icon budget">💰</div>
      <div class="home-card-info">
        <div class="home-card-title">자산관리</div>
        <div class="home-card-desc">대시보드 · 자산현황 · 배당 · 가계부</div>
      </div>
      <div class="home-card-arrow">›</div>
    </a>

    <a href="/stock.html" class="home-card">
      <div class="home-card-icon stock">🛒</div>
      <div class="home-card-info">
        <div class="home-card-title">재고관리</div>
        <div class="home-card-desc">냉장고 · 생필품 · 장보기 목록</div>
      </div>
      <div class="home-card-arrow">›</div>
    </a>
  </div>
</div>
</body>
</html>
